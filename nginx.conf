server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Go server, stripping the /api prefix.
    # The webui APIClient constructs URLs as `${baseUrl}/api${path}`, so
    # /api/workflows → http://server:8080/workflows, etc.
    location /api/ {
        proxy_pass         http://server:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # SPA fallback: serve index.html for all unmatched routes so the
    # client-side router can handle navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
